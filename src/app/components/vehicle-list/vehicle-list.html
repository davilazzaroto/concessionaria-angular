<section class="catalogo" id="vehicles" aria-labelledby="catalogo-titulo">
  <h2 id="catalogo-titulo">Veículos disponíveis</h2>

  <div class="cards">
    <!-- *ngFor itera sobre os veículos; Property Binding [veiculo] envia os dados e Event Binding (verDetalhes) captura o clique -->
    <app-vehicle-card
      *ngFor="let veiculo of veiculos"
      [veiculo]="veiculo"
      (verDetalhes)="selecionarVeiculo($event)"
    ></app-vehicle-card>
  </div>

  <!-- @if renderiza a seção de detalhes apenas quando houver um veículo selecionado -->
  @if (veiculoSelecionado) {
    <app-vehicle-details
      id="detalhes"
      [veiculo]="veiculoSelecionado"
      (fechar)="fecharDetalhes()"
    ></app-vehicle-details>
  }
</section>
